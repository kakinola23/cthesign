name: Deploy to AWS ECS

on:
  push:
    branches: [master]

env:
  AWS_REGION: us-east-1
  BACKEND_ECR: 609956912662.dkr.ecr.us-east-1.amazonaws.com/clinical-agent-backend
  FRONTEND_ECR: 609956912662.dkr.ecr.us-east-1.amazonaws.com/clinical-agent-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push backend
        run: |
          docker build -t $BACKEND_ECR:latest .
          docker push $BACKEND_ECR:latest

      - name: Build and push frontend
        run: |
          docker build -t $FRONTEND_ECR:latest \
            --build-arg REACT_APP_API_URL=/api \
            ./frontend
          docker push $FRONTEND_ECR:latest

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster clinical-agent-cluster \
            --service clinical-agent-backend \
            --force-new-deployment

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster clinical-agent-cluster \
            --service clinical-agent-frontend \
            --force-new-deployment